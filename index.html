<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Treino</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8f135">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--card2:#222;--card3:#2a2a2a;
  --accent:#c8f135;--accent2:#a0d010;--accent-dim:#c8f13522;
  --text:#f0f0f0;--muted:#888;--border:#2e2e2e;
  --done:#1e2e00;--done-text:#c8f135;
  --edit-bg:#1a1a00;--edit-border:#c8f13555;
  --red:#e05050;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:100px;overflow-x:hidden}

header{background:var(--card);border-bottom:2px solid var(--accent);padding:12px 14px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:8px}
header h1{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#today-date{font-size:0.72rem;color:var(--muted);background:var(--card2);padding:3px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.hdr-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:5px 11px;font-size:0.76rem;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.hdr-btn:hover,.hdr-btn.active{border-color:var(--accent);color:var(--accent);background:var(--edit-bg)}
.menu-btn{font-size:0.95rem;padding:5px 10px;line-height:1}
#hdr-menu{display:none;position:absolute;top:100%;right:14px;margin-top:6px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px;flex-direction:column;gap:6px;z-index:250;box-shadow:0 10px 26px rgba(0,0,0,.45)}
#hdr-menu.show{display:flex}
#hdr-menu .hdr-btn{width:100%;text-align:left}
#edit-banner{display:none;background:var(--edit-bg);border-bottom:1px solid var(--edit-border);padding:8px 14px;gap:8px;align-items:center;flex-wrap:wrap}
#edit-banner.show{display:flex}
#edit-banner span{font-size:0.73rem;color:var(--accent);flex:1}

.tabs{display:flex;overflow-x:auto;gap:5px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:var(--card2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:1px;cursor:pointer;transition:all .18s}
.tab-btn:hover{border-color:var(--accent);color:var(--text)}
.tab-btn.active{background:var(--accent);color:#111;border-color:var(--accent)}

.treino-panel{display:none;padding:14px 12px 0}
.treino-panel.active{display:block}

.treino-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.treino-title-input{font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:600;background:var(--card2);border:1px solid var(--edit-border);border-radius:8px;color:var(--text);padding:5px 10px;display:none;outline:none;flex:1}
.treino-title-input:focus{border-color:var(--accent)}
.edit-mode .treino-title-input{display:block}
.header-btns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.treino-panel:not(.edit-mode) .header-btns{flex:1}
.treino-panel:not(.edit-mode) .header-btns .start-btn{margin-right:auto}
.progress-pill{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:0.76rem;color:var(--accent);font-weight:700}
.reset-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:4px 9px;font-size:0.72rem;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.reset-btn:hover{border-color:var(--red);color:var(--red)}
.progress-bar-wrap{background:var(--border);border-radius:4px;height:4px;margin-bottom:12px;overflow:hidden}
.progress-bar-fill{height:4px;background:var(--accent);border-radius:4px;transition:width .4s ease}

.group-block{margin-bottom:4px}
.group-header{display:flex;align-items:center;gap:6px;margin:14px 0 7px;flex-wrap:wrap}
.section-label{font-size:0.66rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.group-name-input{font-size:0.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--card2);border:1px solid var(--edit-border);border-radius:6px;color:var(--muted);padding:3px 8px;width:140px;display:none;font-family:'DM Sans',sans-serif;outline:none}
.group-name-input:focus{border-color:var(--accent)}
.edit-mode .group-name-input{display:block}
.edit-mode .section-label{display:none}
.del-group-btn{display:none;background:none;border:1px solid #e0505033;border-radius:6px;color:var(--red);padding:2px 7px;font-size:0.66rem;cursor:pointer;margin-left:auto}
.edit-mode .del-group-btn{display:inline-flex;align-items:center}

.exercise-list{display:flex;flex-direction:column;gap:5px}
.exercise-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:background .15s,border-color .15s,box-shadow .2s ease}
.exercise-item.done{background:var(--done);border-color:var(--border)}
.edit-mode .exercise-item{border-color:var(--edit-border);border-style:dashed}
.edit-mode .exercise-item.done{background:var(--card2);border-color:var(--edit-border)}
.edit-mode .exercise-item.dragging{opacity:.4;border-style:solid;border-color:var(--accent)}
.edit-mode .exercise-item.drag-over{border-color:var(--accent);border-style:solid;background:var(--edit-bg)}
.ex-row{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:default;user-select:none}
.exercise-item.current .ex-row{cursor:pointer}
.drag-handle{display:none;color:var(--muted);cursor:grab;font-size:1rem;flex-shrink:0;touch-action:none}
.edit-mode .exercise-item .drag-handle{display:block}
.ex-num{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--muted);width:22px;text-align:center;flex-shrink:0}
.exercise-item.done .ex-num{color:var(--accent)}
.edit-mode .exercise-item .ex-num{display:none}
.ex-info{flex:1;min-width:0}
.edit-mode .exercise-item .ex-info{display:none}
.ex-name{font-size:0.9rem;font-weight:600}
.exercise-item.done .ex-name{color:var(--done-text)}
.ex-sets-badge{font-size:0.7rem;color:var(--muted);margin-top:1px}
.ex-edit-input{display:none;flex:1;background:transparent;border:none;border-bottom:1px solid var(--edit-border);color:var(--text);font-size:0.88rem;font-family:'DM Sans',sans-serif;padding:2px 4px;outline:none}
.ex-edit-input:focus{border-color:var(--accent)}
.edit-mode .exercise-item .ex-name,.edit-mode .exercise-item .ex-sets-badge{display:none}
.edit-mode .exercise-item .ex-edit-input{display:block}
.sets-edit-wrap{display:none;align-items:center;gap:4px;flex-shrink:0}
.edit-mode .exercise-item .sets-edit-wrap{display:flex}
.sets-n-input{width:38px;background:var(--card3);border:1px solid var(--edit-border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.78rem;padding:3px 5px;text-align:center;outline:none}
.del-ex-btn{display:none;background:none;border:none;color:var(--red);font-size:1.2rem;cursor:pointer;flex-shrink:0;line-height:1}
.edit-mode .exercise-item .del-ex-btn{display:block}
.check-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.78rem;transition:all .18s;cursor:default}
.exercise-item.current .check-circle{cursor:pointer}
.exercise-item.current .check-circle:hover{border-color:var(--accent)}
.exercise-item.done .check-circle{background:var(--accent);border-color:var(--accent);color:#111}
.edit-mode .exercise-item .check-circle{display:none}

.carga-wrap{display:flex;align-items:center;flex-shrink:0}
.carga-input{width:52px;background:var(--card3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.78rem;padding:6px 4px;text-align:center;outline:none}
.carga-input:focus{border-color:var(--accent)}
.carga-input::placeholder{color:var(--muted)}
.edit-mode .exercise-item .carga-wrap{display:none}

@keyframes popCurrent{0%{box-shadow:0 0 0 2px var(--accent);opacity:.6}100%{box-shadow:0 10px 26px rgba(200,241,53,.35),0 0 0 2px var(--accent);opacity:1}}
.exercise-item.current{
  position:relative;z-index:5;overflow:visible;
  border-color:var(--accent);border-width:2px;
  background:var(--card3);
  box-shadow:0 10px 26px rgba(200,241,53,.35),0 0 0 2px var(--accent);
  animation:popCurrent .3s ease;
}
.exercise-item.current .ex-row{padding:14px 12px}
.exercise-item.current::before{
  content:'AGORA';position:absolute;top:-10px;left:14px;
  background:var(--accent);color:#111;font-family:'Bebas Neue',sans-serif;
  font-size:0.64rem;letter-spacing:1.5px;padding:2px 9px;border-radius:6px;
}
.exercise-item.current .ex-num{color:var(--accent)}
.edit-mode .exercise-item.current{box-shadow:none;border-color:var(--edit-border);border-width:1px;z-index:auto}
.edit-mode .exercise-item.current .ex-row{padding:10px 12px}
.edit-mode .exercise-item.current::before{display:none}

.start-btn{background:none;border:1px solid var(--accent);border-radius:8px;color:var(--accent);padding:4px 10px;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.start-btn:hover{background:var(--edit-bg)}
.start-btn.active{border-color:var(--red);color:var(--red)}
.start-btn.active:hover{background:#2a0d0d}


.add-ex-row{display:none;gap:6px;align-items:center;margin-top:6px}
.edit-mode .add-ex-row{display:flex}
.add-ex-input{flex:1;background:var(--card2);border:1px dashed var(--edit-border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.84rem;padding:8px 12px;outline:none;transition:border-color .15s}
.add-ex-input:focus{border-color:var(--accent);border-style:solid}
.add-ex-input::placeholder{color:var(--muted)}
.add-ex-btn{background:var(--accent);border:none;border-radius:10px;color:#111;font-size:1.2rem;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.add-ex-btn:hover{background:var(--accent2)}
.add-group-row{display:none;margin-top:16px}
.edit-mode .add-group-row{display:flex}
.add-group-btn{background:none;border:1px dashed var(--edit-border);border-radius:10px;color:var(--accent);padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:0.81rem;cursor:pointer;width:100%}
.add-group-btn:hover{background:var(--edit-bg)}
.congrats{display:none;text-align:center;padding:24px 20px;animation:popIn .4s ease}
.congrats.show{display:block}
.edit-mode .congrats{display:none!important}
.congrats .emoji{font-size:2.4rem}
.congrats h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--accent);margin:7px 0 3px;letter-spacing:2px}
.congrats p{color:var(--muted);font-size:0.84rem}
@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

#historico-screen{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto}
#historico-screen.show{display:block}
.hist-header{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--accent);padding:12px 14px;z-index:1}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 13px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:600;cursor:pointer}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.hist-tabs{display:flex;gap:5px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.hist-tab-btn{flex:1;background:var(--card2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.hist-tab-btn.active{background:var(--accent);color:#111;border-color:var(--accent)}
.hist-filtros{display:flex;gap:6px;padding:10px 12px}
.filtro-btn{background:var(--card2);color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-family:'DM Sans',sans-serif;font-size:0.76rem;cursor:pointer;transition:all .15s}
.filtro-btn.active{border-color:var(--accent);color:var(--accent)}
.hist-empty{color:var(--muted);font-size:0.84rem;padding:24px 20px;text-align:center}
.hist-treino-group{padding:0 12px 16px}
.hist-treino-group h3{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;color:var(--accent);margin:14px 0 6px}
.hist-ex-row{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden}
.hist-ex-summary{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist-ex-nome{font-size:0.84rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-ex-ultimo{font-size:0.76rem;color:var(--muted);white-space:nowrap}
.hist-ex-body{display:none;padding:4px 13px 13px}
.hist-ex-row.open .hist-ex-body{display:block}
.hist-chart-svg{width:100%;height:auto;display:block}
.hist-chart-svg .grid-line{stroke:var(--border);stroke-width:1}
.hist-chart-svg .grid-label{fill:var(--muted);font-size:8px}
.hist-chart-svg .chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hist-chart-svg .chart-dot{fill:var(--accent)}
.hist-chart-svg .axis-label{fill:var(--muted);font-size:8px}
.hist-chart-svg .value-label{fill:var(--text);font-size:9px;font-weight:700}
.hist-chart-list{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:0.72rem;color:var(--muted)}
.sessao-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin:0 12px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.8rem}
.sessao-data{display:flex;flex-direction:column;gap:2px}
.sessao-treino-tag{font-family:'Bebas Neue',sans-serif;font-size:0.72rem;letter-spacing:1px;color:var(--accent)}
.sessao-metricas{color:var(--muted);font-size:0.76rem;text-align:right}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <div>💪</div>
  <h1>MEU TREINO</h1>
  <span id="today-date">QUA., 27/05</span>
  <button class="hdr-btn menu-btn" id="menu-toggle" onclick="toggleHdrMenu()">☰</button>
  <div id="hdr-menu">
    <button class="hdr-btn" id="auth-btn" onclick="handleAuth()">☁ Entrar</button>
    <button class="hdr-btn" id="edit-toggle" onclick="toggleEditMode()">✏️ Editar</button>
    <button class="hdr-btn" id="historico-toggle" onclick="openHistorico()">📊 Histórico</button>
    <button class="hdr-btn" id="strava-btn" onclick="handleStrava()">🔗 Strava</button>
  </div>
</header>
<div id="edit-banner">
  <span>✏️ Arraste ⠿ · edite nomes · defina séries×reps · × remove</span>
</div>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<div id="historico-screen">
  <div class="hist-header">
    <button class="back-btn" onclick="closeHistorico()">← Histórico</button>
  </div>
  <div class="hist-tabs">
    <button class="hist-tab-btn active" data-tab="evolucao" onclick="switchHistTab('evolucao')">Evolução</button>
    <button class="hist-tab-btn" data-tab="sessoes" onclick="switchHistTab('sessoes')">Sessões</button>
  </div>
  <div class="hist-filtros">
    <button class="filtro-btn active" data-dias="30" onclick="setHistPeriodo(30)">30 dias</button>
    <button class="filtro-btn" data-dias="90" onclick="setHistPeriodo(90)">90 dias</button>
    <button class="filtro-btn" data-dias="0" onclick="setHistPeriodo(0)">Tudo</button>
  </div>
  <div id="hist-evolucao-panel"></div>
  <div id="hist-sessoes-panel" style="display:none"></div>
</div>
<script>
const TREINOS_DATA = {"A":{"label":"PUSH — Peito Completo, Ombros e Tríceps","grupos":[{"nome":"Peito","exercicios":[{"nome":"Flexões de braço","series":3,"reps":15},{"nome":"Supino inclinado com halteres","series":4,"reps":8},{"nome":"Crucifixo inclinado (halteres/cabo)","series":3,"reps":10},{"nome":"Crucifixo no cabo alto","series":3,"reps":12}]},{"nome":"Ombro","exercicios":[{"nome":"Desenvolvimento com halteres","series":3,"reps":8},{"nome":"Elevação frontal na polia baixa","series":3,"reps":12},{"nome":"Elevação lateral no cabo","series":4,"reps":12}]},{"nome":"Tríceps","exercicios":[{"nome":"Tríceps francês (cabo/halter)","series":3,"reps":10},{"nome":"Tríceps pulley (barra direta ou V)","series":3,"reps":10},{"nome":"Tríceps corda","series":3,"reps":12}]},{"nome":"Cardio","exercicios":[{"nome":"Cardio pós-treino (20 min, intensidade moderada contínua)","series":1,"reps":1}]}]},"B":{"label":"PULL — Costas, Trapézio, Lombar e Bíceps","grupos":[{"nome":"Costas","exercicios":[{"nome":"Puxada alta pronada (aberta)","series":4,"reps":8},{"nome":"Puxada supinada (inversa)","series":3,"reps":10},{"nome":"Remada curvada com barra","series":4,"reps":8}]},{"nome":"Trapézio e Lombar","exercicios":[{"nome":"Remada alta na pegada aberta","series":3,"reps":12},{"nome":"Encolhimento com halteres/barra (segurar 2s)","series":4,"reps":12},{"nome":"Extensão lombar (banco romano)","series":3,"reps":12},{"nome":"Facepull (linha da testa)","series":4,"reps":12}]},{"nome":"Bíceps","exercicios":[{"nome":"Rosca inclinada com halteres (45°)","series":3,"reps":10},{"nome":"Rosca Scott (barra W)","series":3,"reps":10},{"nome":"Rosca martelo com halteres","series":3,"reps":12},{"nome":"Rosca inversa (barra W)","series":3,"reps":15}]},{"nome":"Cardio","exercicios":[{"nome":"Cardio pós-treino (20 min, intensidade moderada contínua)","series":1,"reps":1}]}]},"C":{"label":"LEGS & CORE — Pernas Completas e Abdômen","grupos":[{"nome":"Abdômen","exercicios":[{"nome":"Abdominal infra (suspenso)","series":4,"reps":15},{"nome":"Abdominal supra na polia alta","series":4,"reps":12},{"nome":"Abdominal oblíquo no cabo","series":3,"reps":12}]},{"nome":"Panturrilha","exercicios":[{"nome":"Gêmeos em pé","series":4,"reps":12},{"nome":"Gêmeos sentado (cavalo)","series":4,"reps":15}]},{"nome":"Quadríceps","exercicios":[{"nome":"Agachamento livre (barra)","series":4,"reps":8},{"nome":"Leg press 45° (pés baixos)","series":3,"reps":10},{"nome":"Cadeira extensora (drop-set na última série)","series":3,"reps":12}]},{"nome":"Posterior e Glúteos","exercicios":[{"nome":"Stiff com barra ou halteres","series":4,"reps":8},{"nome":"Mesa ou cadeira flexora","series":3,"reps":10},{"nome":"Elevação pélvica","series":3,"reps":10}]},{"nome":"Adutores e Abdutores","exercicios":[{"nome":"Cadeira abdutora (tronco à frente)","series":3,"reps":15},{"nome":"Cadeira adutora","series":3,"reps":15}]}]},"D":{"label":"CARDIO — Recuperação Ativa (dia de folga da musculação)","grupos":[{"nome":"Cardio LISS","exercicios":[{"nome":"Caminhada rápida na esteira (5,9 km/h, 40 min)","series":1,"reps":1}]}]}};

const STORAGE_KEY='treinos_saved';
const CARGAS_KEY='cargas_saved';
const HIST_KEY='historico_saved';
const TREINOS_VERSION=3;
const TREINOS_VERSION_KEY='treinos_version';
function loadTreinos(){
  const storedV=parseInt(localStorage.getItem(TREINOS_VERSION_KEY)||'0',10);
  if(storedV<TREINOS_VERSION)return JSON.parse(JSON.stringify(TREINOS_DATA));
  const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(TREINOS_DATA));
}
function saveToStorage(){localStorage.setItem(STORAGE_KEY,JSON.stringify(treinos));saveToCloud();}
function loadCargas(){try{return JSON.parse(localStorage.getItem(CARGAS_KEY))||{};}catch{return{};}}
function loadHistorico(){try{return JSON.parse(localStorage.getItem(HIST_KEY))||{};}catch{return{};}}

function updateCarga(key,gi,ei,val){
  const nome=treinos[key].grupos[gi].exercicios[ei].nome;
  const num=val===''?NaN:parseFloat(String(val).replace(',','.'));
  if(!cargas[key])cargas[key]={};
  if(isNaN(num))delete cargas[key][nome];else cargas[key][nome]=num;
  saveCargas();
}
function logHistorico(key,gi,ei){
  const nome=treinos[key].grupos[gi].exercicios[ei].nome,carga=cargas[key]?.[nome];
  if(carga==null)return;
  const hoje=new Date().toISOString().slice(0,10);
  if(!historico[key])historico[key]={};
  if(!historico[key][nome])historico[key][nome]=[];
  const arr=historico[key][nome],e=arr.find(x=>x.data===hoje);
  if(e)e.carga=carga;else arr.push({data:hoje,carga});
  saveHistorico();
}

function saveToCloud(){
  if(!currentUser)return;
  const btn=document.getElementById('auth-btn');const prev=btn?btn.textContent:'';
  if(btn)btn.textContent='⏳';
  db.ref(`users/${currentUser.uid}/treinos`).set(treinos)
    .then(()=>db.ref(`users/${currentUser.uid}/treinosVersion`).set(TREINOS_VERSION))
    .then(()=>{if(btn)btn.textContent=prev;})
    .catch(()=>{if(btn)btn.textContent='⚠ sync';});
}

let firebaseLoadInFlight=false;
function loadFromFirebase(){
  // Guarda contra chamadas concorrentes: o SDK do Firebase Auth pode disparar
  // onAuthStateChanged de novo (ex: refresh de token ao voltar do background)
  // no meio de uma sessão guiada, e um buildAll() redundante nesse momento
  // derruba e recria os paineis, interrompendo o destaque do exercício atual.
  if(firebaseLoadInFlight){logSessao('loadFromFirebase ignorado: ja havia um em andamento');return;}
  firebaseLoadInFlight=true;
  const btn=document.getElementById('auth-btn');if(btn)btn.textContent='⏳';
  Promise.all([
    db.ref(`users/${currentUser.uid}/treinos`).once('value'),
    db.ref(`users/${currentUser.uid}/treinosVersion`).once('value'),
    db.ref(`users/${currentUser.uid}/cargas`).once('value'),
    db.ref(`users/${currentUser.uid}/historico`).once('value'),
    db.ref(`users/${currentUser.uid}/sessoes`).once('value')
  ]).then(([tSnap,tvSnap,cSnap,hSnap,sSnap])=>{
    const data=tSnap.val();
    const cloudV=tvSnap.val()||0;
    let treinosChanged=false;
    if(data&&cloudV>=TREINOS_VERSION){
      if(JSON.stringify(data)!==JSON.stringify(treinos)){treinos=data;treinosChanged=true;}
      localStorage.setItem(STORAGE_KEY,JSON.stringify(treinos));localStorage.setItem(TREINOS_VERSION_KEY,TREINOS_VERSION);
    }
    else saveToCloud();
    const c=cSnap.val();
    if(c){cargas=c;localStorage.setItem(CARGAS_KEY,JSON.stringify(cargas));}
    else saveCargas();
    const h=hSnap.val();
    if(h){historico=h;localStorage.setItem(HIST_KEY,JSON.stringify(historico));}
    else saveHistorico();
    const s=sSnap.val();
    if(s){sessoes=s;localStorage.setItem(SESSOES_KEY,JSON.stringify(sessoes));}
    else saveSessoes();
    if(treinosChanged){logSessao('treinos da nuvem diferem do local, reconstruindo paineis');buildAll();}
    updateAuthUI();
    firebaseLoadInFlight=false;
  }).catch(()=>{firebaseLoadInFlight=false;if(btn)btn.textContent='⚠ offline';});
}

function getDoneKey(t){return `done_${t}_${new Date().toDateString()}`;}
function loadDone(t){try{return JSON.parse(localStorage.getItem(getDoneKey(t)))||[];}catch{return[];}}

// ── SESSAO GUIADA ─────────────────────────────────────────────────────
function getSessionKey(t){return `session_${t}_${new Date().toDateString()}`;}
function isSessionActive(t){return localStorage.getItem(getSessionKey(t))==='1';}
function setSessionActive(t,v){v?localStorage.setItem(getSessionKey(t),'1'):localStorage.removeItem(getSessionKey(t));}
// 'done' guarda nomes de exercicio (nao posicoes): igual carga/historico, pra
// sobreviver a reordenar/adicionar/remover exercicios no meio do dia. Guardar
// por posicao foi o bug relatado em campo — editar a ordem via drag-and-drop
// descolava o "concluido" do exercicio errado, travando o destaque da sessao.
function getDoneCount(key){
  const nomes=treinos[key].grupos.flatMap(g=>g.exercicios).map(e=>e.nome),done=loadDone(key);
  return done.filter(n=>nomes.includes(n)).length;
}
function getCurrentIdx(key){
  const exs=treinos[key].grupos.flatMap(g=>g.exercicios),done=loadDone(key);
  for(let i=0;i<exs.length;i++) if(!done.includes(exs[i].nome)) return i;
  return -1;
}
function updateStartBtn(key){
  const btn=document.getElementById(`start-${key}`);if(!btn)return;
  const total=treinos[key].grupos.flatMap(g=>g.exercicios).length,dc=getDoneCount(key);
  if(total===0||dc===total){btn.style.display='none';return;}
  btn.style.display='';
  const on=isSessionActive(key);
  btn.textContent=on?'■ Encerrar treino':'▶ Iniciar treino';
  btn.classList.toggle('active',on);
  btn.onclick=on?()=>resetTreino(key):()=>startSession(key);
}
// Log leve pra diagnosticar bugs da sessão guiada relatados em campo (ex: destaque
// que trava no meio do treino). Filtre no console do navegador por "[sessao]",
// ou via read_console_messages com pattern "\\[sessao\\]".
function logSessao(...args){console.log('[sessao]',new Date().toISOString(),...args);}

function updateSessionHighlight(key,scroll){
  const panel=document.getElementById(`panel-${key}`);
  if(!panel){logSessao('updateSessionHighlight: panel nao encontrado',{key});return;}
  panel.querySelectorAll('.exercise-item.current').forEach(i=>i.classList.remove('current'));
  if(isSessionActive(key)){
    const idx=getCurrentIdx(key);
    if(idx===-1){logSessao('treino concluido, encerrando sessao',{key});setSessionActive(key,false);}
    else{
      const item=panel.querySelector(`.exercise-item[data-idx="${idx}"]`);
      if(item){item.classList.add('current');if(scroll)item.scrollIntoView({behavior:'smooth',block:'center'});}
      else{
        // Sintoma relatado em campo: destaque "trava" e nao avanca. Se isso
        // aparecer no log, o idx calculado nao bate com nenhum item renderizado
        // no DOM (paineis dessincronizados de treinos[key] ou de 'done').
        const total=treinos[key]?.grupos?.flatMap(g=>g.exercicios)?.length;
        const domCount=panel.querySelectorAll('.exercise-item').length;
        logSessao('ALERTA: item current nao encontrado no DOM',{key,idx,total,domCount,done:loadDone(key)});
      }
    }
  }
  updateStartBtn(key);
}
function startSession(key){logSessao('startSession',{key});setSessionActive(key,true);updateSessionHighlight(key,true);}

// Ao voltar de segundo plano (tela bloqueada, troca de app), reforça o
// destaque do exercício atual: o navegador pode restaurar uma tela
// parada/desatualizada, e reaplicar a classe 'current' força o repaint.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    logSessao('app voltou ao primeiro plano, revalidando destaque');
    Object.keys(treinos).forEach(k=>updateSessionHighlight(k,false));
  }
});

  const sn=ex.series||3,rn=ex.reps||12;

  item.innerHTML=`
    <div class="ex-row">
      <span class="drag-handle">⠿</span>
      <div class="ex-num">${String(idx+1).padStart(2,'0')}</div>
      <div class="ex-info">
        <div class="ex-name">${esc(ex.nome)}</div>
        <div class="ex-sets-badge">${sn} séries</div>
      </div>
      <input class="ex-edit-input" value="${esc(ex.nome)}" placeholder="Nome..."
        oninput="treinos['${key}'].grupos[${gi}].exercicios[${ei}].nome=this.value">
      <div class="sets-edit-wrap">
        <input class="sets-n-input" type="number" min="1" max="10" value="${sn}"

      </div>

        <input class="carga-input" type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${cargaVal}"

      </div>

      <div class="check-circle" title="Marcar como concluído">${isDone?'✓':''}</div>
    </div>`;

    item.querySelector('.ex-row').onclick=(e)=>{

      const active=isSessionActive(key),cur=getCurrentIdx(key);
      if(active&&idx===cur){quickCompleteEx(e,key,gi,ei,idx,item);}
      else{
        // Toque no check-circle nao registrado: ou a sessao nao esta ativa, ou
        // esse nao e o exercicio "atual" pela contagem do app. Se o usuario
        // reportar destaque travado, esse log mostra o idx tocado vs o idx
        // que o app considera atual (cur) — evidencia direta do desalinhamento.
        logSessao('tap em check-circle ignorado (fora de ordem ou sessao inativa)',{key,idxTocado:idx,sessionActive:active,currentIdx:cur});
      }
    };

  return item;
}




function quickCompleteEx(e,key,gi,ei,exIdx,item){

  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.dias,10)===dias));
  buildHistorico();
}

function cutoffDate(){
  if(!histPeriodoDias)return null;
  const d=new Date();d.setDate(d.getDate()-histPeriodoDias);
  return d.toISOString().slice(0,10);
}

function formatDataBR(iso){const[y,m,d]=iso.split('-');return `${d}/${m}`;}

function buildHistorico(){buildEvolucaoPanel();buildSessoesPanel();}

function buildEvolucaoPanel(){
  const el=document.getElementById('hist-evolucao-panel');
  const cutoff=cutoffDate();
  const keys=Object.keys(historico);
  if(!keys.length){el.innerHTML='<div class="hist-empty">Ainda sem histórico de carga. Continue registrando pesos nos treinos.</div>';return;}
  let html='',temLinha=false;
  keys.forEach(key=>{
    const exs=Object.keys(historico[key]||{});
    if(!exs.length)return;
    const label=(treinos[key]?.label||key).split(' — ')[0];
    let grupoHtml='';
    exs.forEach((nome,ei)=>{
      const pontos=(historico[key][nome]||[]).filter(p=>!cutoff||p.data>=cutoff).sort((a,b)=>a.data<b.data?-1:1);
      if(!pontos.length)return;
      temLinha=true;
      const ultimo=pontos[pontos.length-1].carga,primeiro=pontos[0].carga,delta=ultimo-primeiro;
      const deltaTxt=pontos.length>1?` (${delta>=0?'+':''}${delta}kg no período)`:'';
      const rowId=`hist-ex-${key}-${ei}`;
      grupoHtml+=`
      <div class="hist-ex-row" id="${rowId}">
        <div class="hist-ex-summary" onclick="toggleHistEx('${rowId}')">
          <div class="hist-ex-nome">${esc(nome)}</div>
          <div class="hist-ex-ultimo">${ultimo}kg${deltaTxt}</div>
        </div>
        <div class="hist-ex-body" data-key="${esc(key)}" data-nome="${esc(nome)}"></div>
      </div>`;
    });
    if(grupoHtml)html+=`<div class="hist-treino-group"><h3>${esc(label)}</h3>${grupoHtml}</div>`;
  });
  el.innerHTML=temLinha?html:'<div class="hist-empty">Nenhum registro de carga nesse período.</div>';
}

function toggleHistEx(rowId){
  const row=document.getElementById(rowId);if(!row)return;
  if(row.classList.contains('open')){row.classList.remove('open');return;}
  row.classList.add('open');
  const body=row.querySelector('.hist-ex-body');
  if(!body.dataset.built){
    const key=body.dataset.key,nome=body.dataset.nome,cutoff=cutoffDate();
    const pontos=(historico[key]?.[nome]||[]).filter(p=>!cutoff||p.data>=cutoff).sort((a,b)=>a.data<b.data?-1:1);
    body.innerHTML=buildSvgChart(pontos);
    body.dataset.built='1';
  }
}

function buildSvgChart(pontos){
  if(pontos.length===1)return `<div class="hist-empty" style="padding:12px 0">Só um registro nesse período: ${pontos[0].carga}kg em ${formatDataBR(pontos[0].data)}.</div>`;
  if(pontos.length<1)return '<div class="hist-empty" style="padding:12px 0">Dados insuficientes nesse período.</div>';
  const W=300,H=110,padL=30,padR=10,padT=10,padB=20;
  const cargas=pontos.map(p=>p.carga);
  let min=Math.min(...cargas),max=Math.max(...cargas);
  if(min===max){min-=1;max+=1;}
  const x=i=>padL+(i/(pontos.length-1))*(W-padL-padR);
  const y=v=>padT+(1-(v-min)/(max-min))*(H-padT-padB);
  let svg=`<svg class="hist-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  [min,(min+max)/2,max].forEach(v=>{
    const gy=y(v);
    svg+=`<line class="grid-line" x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}"/>`;
    svg+=`<text class="grid-label" x="${padL-5}" y="${(gy+3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  });
  const linePts=pontos.map((p,i)=>`${x(i).toFixed(1)},${y(p.carga).toFixed(1)}`).join(' ');
  svg+=`<polyline class="chart-line" points="${linePts}"/>`;
  pontos.forEach((p,i)=>{
    svg+=`<circle class="chart-dot" cx="${x(i).toFixed(1)}" cy="${y(p.carga).toFixed(1)}" r="${i===pontos.length-1?4:3}"/>`;
  });
  const lastX=x(pontos.length-1),lastY=y(pontos[pontos.length-1].carga);
  svg+=`<text class="value-label" x="${lastX.toFixed(1)}" y="${(lastY-8).toFixed(1)}" text-anchor="end">${pontos[pontos.length-1].carga}kg</text>`;
  svg+=`<text class="axis-label" x="${padL}" y="${H-6}">${formatDataBR(pontos[0].data)}</text>`;
  svg+=`<text class="axis-label" x="${W-padR}" y="${H-6}" text-anchor="end">${formatDataBR(pontos[pontos.length-1].data)}</text>`;
  svg+='</svg>';
  const listHtml=pontos.map(p=>`<span>${formatDataBR(p.data)}: ${p.carga}kg</span>`).join('');
  return svg+`<div class="hist-chart-list">${listHtml}</div>`;
}

function treinoDoDia(data){
  for(const key of Object.keys(historico)){
    const exs=historico[key];
    for(const nome of Object.keys(exs)){
      if((exs[nome]||[]).some(p=>p.data===data))return (treinos[key]?.label||key).split(' — ')[0];
    }
  }
  return null;
}

function buildSessoesPanel(){
  const el=document.getElementById('hist-sessoes-panel');
  const todasDatas=Object.keys(sessoes);
  if(!todasDatas.length){el.innerHTML='<div class="hist-empty">Nenhuma sessão sincronizada ainda. Conecte o Strava no menu ☰.</div>';return;}
  const cutoff=cutoffDate();
  const datas=todasDatas.filter(d=>!cutoff||d>=cutoff).sort((a,b)=>a<b?1:-1);
  if(!datas.length){el.innerHTML='<div class="hist-empty">Nenhuma sessão nesse período.</div>';return;}
  el.innerHTML=datas.map(d=>{
    const s=sessoes[d],treino=treinoDoDia(d);
    const metricas=[s.duracaoMin?`${s.duracaoMin}min`:null,s.fcMedia?`${s.fcMedia}bpm`:null,s.calorias?`${s.calorias}kcal`:null].filter(Boolean).join(' · ');
    return `<div class="sessao-row">
        <div class="sessao-data">
          <span>${formatDataBR(d)}</span>
          ${treino?`<span class="sessao-treino-tag">${esc(treino)}</span>`:''}
        </div>
        <div class="sessao-metricas">${metricas||'—'}</div>
      </div>`;
  }).join('');
}

// ── DRAG & DROP ───────────────────────────────────────────────────────
function initDrag(listEl,key,gi){
  let dragSrc=null,touchItem=null,touchClone=null,touchOffY=0;
  const items=()=>[...listEl.querySelectorAll('.exercise-item')];
  function onTS(e){
    if(!editMode)return;const h=e.target.closest('.drag-handle');if(!h)return;
    touchItem=h.closest('.exercise-item');const r=touchItem.getBoundingClientRect();touchOffY=e.touches[0].clientY-r.top;
    touchClone=touchItem.cloneNode(true);
    touchClone.style.cssText=`position:fixed;left:${r.left}px;width:${r.width}px;opacity:.85;pointer-events:none;z-index:999;border:1px solid var(--accent);border-radius:12px;background:#1a2a00;`;
    touchClone.style.top=(e.touches[0].clientY-touchOffY)+'px';document.body.appendChild(touchClone);touchItem.classList.add('dragging');e.preventDefault();
  }
  function onTM(e){
    if(!touchItem||!touchClone)return;const y=e.touches[0].clientY;touchClone.style.top=(y-touchOffY)+'px';
    const its=items().filter(i=>i!==touchItem);its.forEach(i=>i.classList.remove('drag-over'));
    const tgt=its.find(i=>{const r=i.getBoundingClientRect();return y>r.top&&y<r.bottom;});
    if(tgt)tgt.classList.add('drag-over');e.preventDefault();
  }
  function onTE(){
    if(!touchItem)return;const it=items();const tgt=it.find(i=>i.classList.contains('drag-over'));
    if(tgt)reorderEx(key,gi,it.indexOf(touchItem),it.indexOf(tgt));
    else{touchItem.classList.remove('dragging');it.forEach(i=>i.classList.remove('drag-over'));}
    if(touchClone){touchClone.remove();touchClone=null;}touchItem=null;
  }
  listEl.addEventListener('touchstart',onTS,{passive:false});listEl.addEventListener('touchmove',onTM,{passive:false});listEl.addEventListener('touchend',onTE);
  function bindItem(item){
    const h=item.querySelector('.drag-handle');
    h.addEventListener('mousedown',()=>{item.draggable=true;});document.addEventListener('mouseup',()=>{item.draggable=false;});
    item.addEventListener('dragstart',function(e){dragSrc=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragover',(e)=>{e.preventDefault();if(e.currentTarget!==dragSrc){items().forEach(i=>i.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over');}});
    item.addEventListener('drop',(e)=>{e.preventDefault();const ov=e.currentTarget;if(ov&&dragSrc&&ov!==dragSrc){const it=items();reorderEx(key,gi,it.indexOf(dragSrc),it.indexOf(ov));}});
    item.addEventListener('dragend',()=>{items().forEach(i=>i.classList.remove('dragging','drag-over'));dragSrc=null;});
  }
  items().forEach(bindItem);
}
function reorderEx(key,gi,from,to){const arr=treinos[key].grupos[gi].exercicios;const[m]=arr.splice(from,1);arr.splice(to,0,m);rebuildPanel(key);}


function switchTab(key){
  currentTab=key;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  document.querySelectorAll('.treino-panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${key}`));
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
document.getElementById('today-date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).toUpperCase();
buildAll();
auth.onAuthStateChanged(user=>{currentUser=user;updateAuthUI();if(user){loadFromFirebase();handleStravaCallback();}});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
